name: Build Buds On audio handoff preview (macOS)

on:
  push:
    branches: [experimental/buds-on-mac-handoff]
    paths:
      - '.github/workflows/build-buds-on-macos.yml'
      - 'add_buds_on.py'
      - 'patches/**'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    name: Build Apple Silicon .pkg
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout diagnostic patch
        uses: actions/checkout@v7

      - name: Checkout pinned GalaxyBudsClient source
        uses: actions/checkout@v7
        with:
          repository: timschneeb/GalaxyBudsClient
          ref: 85dfc8bb39fc45d3c30ecf71ab2c663fb1d41729
          path: GalaxyBudsClient-source
          persist-credentials: false

      - name: Checkout pinned FluentAvalonia source
        uses: actions/checkout@v7
        with:
          repository: amwx/FluentAvalonia
          ref: 215ee0481e8b0e6d396cbe2a0f33dc791c5646ab
          path: FluentAvalonia-source
          persist-credentials: false

      - name: Select Xcode 27.2 required by .NET macOS workload
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Install .NET SDK 11 from upstream global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: GalaxyBudsClient-source/global.json

      - name: Print build tools
        shell: bash
        run: |
          xcodebuild -version
          dotnet --version
          uname -m
          printf 'NUGET_PACKAGES=%s/budson-nuget/\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Apply Buds On preview patch
        shell: bash
        run: python3 add_buds_on.py GalaxyBudsClient-source

      - name: Apply and test the Manager preview
        shell: bash
        working-directory: GalaxyBudsClient-source
        run: |
          git apply --check "$GITHUB_WORKSPACE/patches/buds-on-mac-handoff.patch"
          git apply "$GITHUB_WORKSPACE/patches/buds-on-mac-handoff.patch"
          git apply "$GITHUB_WORKSPACE/patches/buds-on-host-setup.patch"
          git apply "$GITHUB_WORKSPACE/patches/buds-on-shared-controls.patch"
          git apply "$GITHUB_WORKSPACE/patches/buds-on-battery-display.patch"
          git apply "$GITHUB_WORKSPACE/patches/buds-on-manager-fixes.patch"
          git apply "$GITHUB_WORKSPACE/patches/buds-on-manager-parity.patch"
          python3 "$GITHUB_WORKSPACE/scripts/stamp_preview.py" "$PWD"
          bash "$GITHUB_WORKSPACE/tests/run-handoff-tests.sh" "$PWD"

      - name: Fix and test empty control accessibility
        shell: bash
        run: |
          python3 scripts/fix_fluentavalonia_accessibility.py \
            FluentAvalonia-source "$RUNNER_TEMP/handoff-feed" "$RUNNER_TEMP/handoff-restore.config"
          dotnet pack FluentAvalonia-source/src/FluentAvalonia/FluentAvalonia.csproj \
            -c Release -o "$RUNNER_TEMP/handoff-feed" \
            --source https://api.nuget.org/v3/index.json -p:GeneratePackageOnBuild=false
          dotnet restore tests/RepeaterAccessibility/RepeaterAccessibility.csproj \
            --configfile "$RUNNER_TEMP/handoff-restore.config"
          dotnet run --project tests/RepeaterAccessibility/RepeaterAccessibility.csproj \
            --no-restore -c Release

      - name: Build native macOS Bluetooth library
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE/GalaxyBudsClient-source"
          xcodebuild \
            -project "$ROOT/GalaxyBudsClient.Platform.OSX/Native/NativeInterop.xcodeproj" \
            -scheme NativeInterop \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR="$ROOT/GalaxyBudsClient.Platform.OSX/Native/Build/Release" \
            CONFIGURATION_TEMP_DIR="$ROOT/GalaxyBudsClient.Platform.OSX/Native/Build/Intermediates.noindex" \
            build
          test -f "$ROOT/GalaxyBudsClient.Platform.OSX/Native/Build/Release/libNativeInterop.dylib"

      - name: Install macOS .NET workload
        shell: bash
        working-directory: GalaxyBudsClient-source
        run: dotnet workload install macos

      - name: Restore .NET dependencies
        shell: bash
        working-directory: GalaxyBudsClient-source
        run: |
          dotnet restore \
            -p:UseMacOSSDK=true \
            -r osx-arm64 \
            --configfile "$RUNNER_TEMP/handoff-restore.config" \
            GalaxyBudsClient/GalaxyBudsClient.csproj

      - name: Publish macOS Apple Silicon installer
        shell: bash
        working-directory: GalaxyBudsClient-source
        run: |
          dotnet publish \
            -p:UseMacOSSDK=true \
            -f net11.0-macos \
            -r osx-arm64 \
            -o out/buds-on-arm64 \
            -c Release \
            --self-contained true \
            --no-restore \
            GalaxyBudsClient/GalaxyBudsClient.csproj
          echo 'Installer outputs:'
          find out/buds-on-arm64 -maxdepth 1 -type f -name '*.pkg' -print
          test -n "$(find out/buds-on-arm64 -maxdepth 1 -type f -name '*.pkg' -print -quit)"

      - name: Verify the packaged app and handoff entry points
        shell: bash
        run: |
          set -euo pipefail
          packages=(GalaxyBudsClient-source/out/buds-on-arm64/*.pkg)
          test "${#packages[@]}" -eq 1
          pkgutil --expand-full "${packages[0]}" "$RUNNER_TEMP/buds-expanded"
          bundle="$(find "$RUNNER_TEMP/buds-expanded" -name '*.app' -type d -print -quit)"
          test -n "$bundle"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")"
          lipo -verify_arch arm64 "$bundle/Contents/MacOS/$executable"
          library="$(find "$bundle" -name libNativeInterop.dylib -type f -print -quit)"
          test -n "$library"
          lipo -verify_arch arm64 "$library"
          nm -gU "$library" > "$RUNNER_TEMP/buds-exports.txt"
          for suffix in prepare request close is_open; do
            grep -Eq "[[:space:]]_bt_budson_handoff_${suffix}$" "$RUNNER_TEMP/buds-exports.txt"
          done
          mkdir -p installer
          cp "${packages[0]}" installer/GalaxyBudsOn-Handoff-Preview-5-macOS-arm64.pkg
          shasum -a 256 installer/*.pkg

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: GalaxyBudsOn-handoff-experiment-macos-arm64
          path: installer/*.pkg
          if-no-files-found: error
          retention-days: 14
