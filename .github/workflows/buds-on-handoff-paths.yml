name: Build Buds On handoff path reader

on:
  workflow_dispatch:
  push:
    branches: [diagnostics/buds-on-handoff-paths]
    paths:
      - 'tools/buds-on-handoff-paths/**'
      - '.github/workflows/buds-on-handoff-paths.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      TOOL_ROOT: tools/buds-on-handoff-paths
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish standalone Windows x64 reader without runtime extraction
        shell: pwsh
        run: |
          $kit = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/handoff-kit"
          $reader = Join-Path $kit 'reader'
          dotnet publish "$env:TOOL_ROOT/reader/Callsites.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o $reader
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$env:TOOL_ROOT/Read-Buds-Handoff-Paths.cmd","$env:TOOL_ROOT/Read-Buds-Handoff-Paths.ps1" $kit
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = (New-Item -ItemType File -Path "$env:RUNNER_TEMP/no-extraction-here").FullName
          & "$reader/BudsOnCallsites.exe" --self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exercise packaged reader and launcher on Windows PowerShell 5.1
        shell: powershell
        run: |
          & "$env:TOOL_ROOT/ci/Test-WindowsReader.ps1" -Kit "$env:RUNNER_TEMP/handoff-kit"
      - uses: actions/upload-artifact@v4
        with:
          name: Buds-On-Handoff-Paths-Windows-x64
          path: ${{ runner.temp }}/handoff-kit/
          if-no-files-found: error
